# =====================================================================
# Risk policy: HARD limits, enforced by deterministic code (policy engine).
# No agent can override these. Changing this file requires a PR reviewed
# by a human; the policy_version is stamped on every run and risk check.
# Status: DESIGN DRAFT. Values are proposed defaults pending your answers
# in docs/design/OPEN_QUESTIONS.md.
# =====================================================================
policy_version: "2026.11-draft.1"

capital:
  starting_nav_usd: 1000000
  collateral:
    vehicle: "US T-bills (ladder <= 13 weeks) or SGOV/BIL money-market ETF"
    min_pct_nav_in_collateral: 0.85      # the part of NAV that earns ~the Fed funds rate
    min_pct_nav_free_cash: 0.05          # fees, assignment, debit spreads
  hurdle:
    series_id: "fred:DFF"                # effective Fed funds, compounded daily
    target_excess_return_annual: [0.04, 0.08]   # target, not a promise
    max_drawdown_budget: 0.12

portfolio_limits:
  bpr_utilization_pct_nav:
    target_range: [0.25, 0.40]
    hard_max: 0.50                        # always keep >= 50% dry powder for vol spikes
  net_beta_weighted_delta_pct_nav:        # SPY-beta-weighted $delta / NAV
    max_long: 0.60
    max_short: -0.30
  max_short_vega_usd_per_vol_point: 6000  # 0.6% NAV per 1 IV point across the book
  max_single_underlying_pct_bpr: 0.25
  max_same_expiry_week_pct_bpr: 0.30      # ladder expiries
  max_correlated_cluster_pct_bpr: 0.45    # e.g. SPX + EFA + EEM move together in a crash

stress_scenarios:                         # full revaluation of every leg, post-trade
  - id: equity_crash_20
    shocks: {equity: -0.20, intl_equity: -0.24, iv_abs_pts: 25, gold: 0.03, crude: -0.15}
    max_loss_pct_nav: 0.12
  - id: equity_gap_10
    shocks: {equity: -0.10, intl_equity: -0.12, iv_abs_pts: 12}
    max_loss_pct_nav: 0.06
  - id: melt_up_10
    shocks: {equity: 0.10, intl_equity: 0.10, iv_abs_pts: -4}
    max_loss_pct_nav: 0.04
  - id: oil_spike_40
    shocks: {crude: 0.40, natgas: 0.30, equity: -0.05, iv_abs_pts: 8}
    max_loss_pct_nav: 0.05
  - id: oil_crash_35
    shocks: {crude: -0.35, natgas: -0.25, equity: -0.06}
    max_loss_pct_nav: 0.05
  - id: metals_flush
    shocks: {gold: -0.12, silver: -0.22}
    max_loss_pct_nav: 0.04
  - id: rates_shock_up_100bp
    shocks: {ust10y_bp: 100, equity: -0.07, gold: -0.05, tlt: -0.12}
    max_loss_pct_nav: 0.05
  - id: dollar_spike
    shocks: {dxy: 0.06, intl_equity: -0.12, gold: -0.05, crude: -0.08}
    max_loss_pct_nav: 0.05
  - id: vol_spike_no_move
    shocks: {iv_multiplier: 1.6}
    max_loss_pct_nav: 0.04

sleeves:                                  # risk_budget = share of total stress-loss budget
  us_equity_index: {risk_budget: 0.30, max_bpr_pct_nav: 0.20}
  intl_equity:     {risk_budget: 0.15, max_bpr_pct_nav: 0.10}
  energy:          {risk_budget: 0.15, max_bpr_pct_nav: 0.08}
  precious_metals: {risk_budget: 0.15, max_bpr_pct_nav: 0.08}
  rates:           {risk_budget: 0.10, max_bpr_pct_nav: 0.06}   # optional sleeve
  opportunistic:   {risk_budget: 0.05, max_bpr_pct_nav: 0.04}
  reserve:         {risk_budget: 0.10}                            # never allocated

position_rules:
  allowed_structures: [short_put, put_credit_spread, call_credit_spread, iron_condor]
  naked_short_calls: false                # bearish views use call credit SPREADS only
  naked_short_puts:
    allowed: true
    underlying_kinds: [index, etf]
    max_notional_pct_nav_per_position: 0.10
    max_loss_at_minus_25pct_move_pct_nav: 0.03
  defined_risk_only_underlyings: ["/NG", "UNG", "SLV", "/SI"]   # vol too explosive for naked
  short_strike_abs_delta: {min: 0.08, max: 0.25, default: 0.16}
  dte: {min: 21, max: 75, target: 45}
  max_loss_per_defined_risk_position_pct_nav: 0.02
  min_credit_pct_of_width: 0.20           # spreads must pay >= 20% of width
  liquidity:
    min_open_interest: 500
    max_bid_ask_pct_of_mid: 0.10
  iv_rank_to_open:
    warn_below: 20
    block_below: 5

management:                               # applied daily by the position monitor
  take_profit_pct_of_credit: 0.50
  time_exit_dte: 21
  stop_loss_multiple_of_credit: 2.0       # close when loss = 2x credit received
  defend_when_short_strike_abs_delta: 0.35
  roll_rule: "roll out in time only for a net credit; never add risk to avoid booking a loss"
  assignment_rule: "assigned ETF shares are sold or covered-called within 1 session"

event_blackouts:                          # no NEW short-vol risk in affected sleeves
  FOMC:        {hours_before: 24, sleeves: [us_equity_index, rates, precious_metals]}
  CPI:         {hours_before: 24, sleeves: [us_equity_index, rates, precious_metals]}
  NFP:         {hours_before: 12, sleeves: [us_equity_index, rates]}
  OPEC:        {hours_before: 24, sleeves: [energy]}
  EIA_STORAGE: {hours_before: 12, sleeves: [energy], instruments: ["/NG", "UNG"]}
  ELECTION:    {hours_before: 72, sleeves: [all]}

circuit_breakers:
  - id: dd_5
    when: "drawdown_from_peak >= 0.05"
    action: halve_new_risk
  - id: dd_8
    when: "drawdown_from_peak >= 0.08"
    action: no_new_positions
  - id: dd_12
    when: "drawdown_from_peak >= 0.12"
    action: derisk_to_half_bpr_and_require_human_review
  - id: daily_loss
    when: "day_pnl_pct_nav <= -0.025"
    action: halt_new_risk_today
  - id: vix_35
    when: "vix_close >= 35"
    action: no_new_naked_puts
  - id: stale_critical_data
    when: "any critical series older than 2x cache_ttl"
    action: research_only_mode
  - id: llm_budget
    when: "run cost_usd > config.budgets.max_run_usd"
    action: stop_run_and_open_incident

execution:
  default_mode: paper                     # live requires explicit config change + approval
  human_approval: per_ticket
  order_type: "limit at mid; improve by 1 tick every 2 minutes; max 3 improvements"
  max_orders_per_day: 20
  allowed_hours_et: ["09:45", "15:45"]
