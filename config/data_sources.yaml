# =====================================================================
# Data source registry + seed series catalog.
# Only the Data Steward (deterministic code) calls these endpoints.
# Agents read the stored copies through read-only tools.
#
# Cache rule (the "never download twice" contract):
#   fetch(series) happens only if  now() >= ref.series.next_due_at
#   next_due_at = the next scheduled release (release calendar) or
#                 last_fetched_at + cache_ttl when no calendar exists.
#   Only the delta since ref.series.last_obs is requested (plus a
#   revision window for series with vintages).
#   Identical payloads hash to the same raw.blob row and are not re-stored.
# Status: DESIGN DRAFT. Series codes to be verified by each adapter's
# contract test in Phase 1.
# =====================================================================
ttl_defaults:
  intraday: 15m          # option chains during market hours (structuring only)
  daily: 20h
  weekly: 6d12h
  monthly: 25d
  quarterly: 80d
  document: never        # a URL is fetched once (url_hash); "living" pages use 24h

sources:
  fred:        {name: "FRED / ALFRED (St. Louis Fed)", auth: api_key, cost: free, vintages: true,
                use: "rates, liquidity, credit spreads, inflation, labor, financial conditions, vol indices"}
  treasury:    {name: "US Treasury FiscalData (Daily Treasury Statement)", auth: none, cost: free,
                use: "daily TGA balance, auction results"}
  nyfed:       {name: "New York Fed", auth: none, cost: free,
                use: "GSCPI supply-chain index, SOFR/EFFR, ACM term premium"}
  eia:         {name: "US Energy Information Administration API v2", auth: api_key, cost: free,
                use: "crude/products inventories, Cushing, production, natgas storage, STEO"}
  cftc:        {name: "CFTC Commitments of Traders (public reporting API)", auth: none, cost: free,
                use: "positioning in CL, NG, GC, SI, ES, ZN"}
  cboe:        {name: "Cboe index history", auth: none, cost: free,
                use: "VIX, VIX9D, VIX3M, VIX6M, SKEW, OVX, GVZ"}
  shiller:     {name: "Robert Shiller online data", auth: none, cost: free,
                use: "US CAPE (monthly, history back to 1871), real earnings"}
  gpr:         {name: "Caldara-Iacoviello Geopolitical Risk Index", auth: none, cost: free,
                use: "daily + monthly GPR, threats vs acts, country GPR"}
  oecd:        {name: "OECD data API", auth: none, cost: free, use: "composite leading indicators"}
  bis:         {name: "BIS statistics", auth: none, cost: free, use: "global liquidity indicators, USD credit to non-US"}
  imf:         {name: "IMF data", auth: none, cost: free, use: "reserves (COFER), WEO forecasts"}
  worldbank:   {name: "World Bank Pink Sheet", auth: none, cost: free, use: "monthly commodity prices"}
  atlfed:      {name: "Atlanta Fed GDPNow", auth: none, cost: free, use: "real-time GDP nowcast"}
  massive:     {name: "Massive (Polygon) market data", auth: api_key, cost: paid,
                use: "EOD/intraday bars for indices, ETFs, FX; option chains with IV + Greeks",
                note: "a Massive connector is already attached to your Claude account"}
  ibkr:        {name: "Interactive Brokers", auth: broker, cost: "account",
                use: "positions, balances, margin (BPR) what-if, option chains, paper/live orders",
                note: "an IBKR connector is already attached to your Claude account"}
  global_cape: {name: "Global/international CAPE provider (TBD)", auth: api_key, cost: paid,
                use: "CAPE for ACWI, EAFE, EM and countries",
                note: "open question: Research Affiliates / Barclays / Siblis, or computed from index EPS"}
  web:         {name: "Claude server-side web search + fetch", auth: none, cost: "per use",
                use: "news, central-bank statements, OPEC, freight indices (Drewry WCI, Freightos)",
                allowed_domains: [federalreserve.gov, ecb.europa.eu, boj.or.jp, bankofengland.co.uk,
                                  pbc.gov.cn, opec.org, iea.org, eia.gov, imf.org, bis.org,
                                  reuters.com, apnews.com, drewry.co.uk, freightos.com, wto.org]}

